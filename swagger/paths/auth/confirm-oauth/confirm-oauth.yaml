tags:
  - Auth
summary: Login via Google OAuth
operationId: loginWithGoogleOAuth
description: 'Log in a user using the provided Google OAuth code and return an access token.'
security: [] # Google OAuth login не вимагає авторизації
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            example: 'google_oauth_code'
responses:
  '200':
    description: Successfully logged in via Google OAuth!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in via Google OAuth!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.S9pTijKb-KZylqbt8Tf1A_aFcpq4BeW1JNk7a7uGcmg'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '429':
    $ref: '../../../components/responses/429.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
