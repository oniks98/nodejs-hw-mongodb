tags:
  - Auth
summary: Get Google OAuth URL
operationId: getGoogleOAuthUrl
description: 'Generate and return the Google OAuth URL for user authentication.'
security: [] # Google OAuth URL не потребує авторизації
responses:
  '200':
    description: Successfully retrieved Google OAuth URL.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully get Google OAuth url!'
            data:
              type: object
              properties:
                url:
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?response_type=code&client_id=YOUR_CLIENT_ID&redirect_uri=YOUR_REDIRECT_URI&scope=YOUR_SCOPES'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '429':
    $ref: '../../../components/responses/429.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
