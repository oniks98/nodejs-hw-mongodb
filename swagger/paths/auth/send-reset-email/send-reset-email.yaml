tags:
  - Auth
summary: Reset email
operationId: sendResetEmail
description: 'Send a reset password email with a reset token to the user'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            example: 'user@example.com'
responses:
  '200':
    description: Reset password email has been successfully sent.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              example: {}
  '404':
    $ref: '../../../components/responses/404.yaml'
  '429':
    $ref: '../../../components/responses/429.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
